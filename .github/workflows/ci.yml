name: CI

on:
  push:
  pull_request:

jobs:
  firmware-build:
    name: Firmware build (pio run -e due)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-due-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e due

  native-tests:
    name: Unit tests (pio test -e native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native

  host-tests:
    name: Host tests (ruff + pytest host/, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows = the Pilot A laptop; Linux = the Raspberry Pi later.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "host[dev]"
      - run: ruff check host
      - run: ruff format --check host
      - run: pytest host/
