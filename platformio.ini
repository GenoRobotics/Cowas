; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = due

[env:due]
platform = atmelsam
board = due
framework = arduino
monitor_speed = 9600
; the console compares whole lines: send each line on ENTER, ending in LF only (a CR breaks commands)
monitor_eol = LF
monitor_filters = send_on_enter
monitor_echo = yes
build_flags = -I include
	-I include/interfaces
lib_deps =
	pololu/DualVNH5019MotorShield@^3.0.0
	arduino-libraries/SD@^1.2.4
	paulstoffregen/Time@^1.6.1
; unit tests run on the host only (env:native); on-device checks are console commands
test_ignore = *

; Host unit tests for the pure logic in src/Core/ (no Arduino.h): pio test -e native
; Needs a host C/C++ compiler on PATH (gcc/g++; on Windows e.g. WinLibs/MinGW-w64).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<Core/>
build_flags = -std=gnu++11 -Wall -Wextra
	-I src/Core
	-I test/stubs

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -I include
	-I include/interfaces
monitor_speed = 9600
lib_deps = 
	pololu/DualVNH5019MotorShield@^3.0.0
	arduino-libraries/SD@^1.2.4
	paulstoffregen/Time@^1.6.1
